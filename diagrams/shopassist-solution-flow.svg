<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs><rect width="1600" height="900" fill="#fff"/><text x="800" y="55" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#172b4d">SHOPASSIST — LLM COST OPTIMIZATION</text><rect x="520" y="90" width="560" height="78" rx="14" fill="#eaf2ff" stroke="#4a78c2" stroke-width="2"/><text x="800" y="122" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#17365d">CUSTOMER SUPPORT INPUT</text><text x="800" y="148" text-anchor="middle" font-family="Arial" font-size="16" fill="#17365d">Ticket thread + structured order data</text><path d="M800 168 V205 H395 V245 M800 205 H1205 V245" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="55" y="245" width="690" height="410" rx="18" fill="#f7fbff" stroke="#4a90c8" stroke-width="3"/><path d="M73 245 H727 Q745 245 745 263 V295 H55 V263 Q55 245 73 245" fill="#e8f3ff"/><text x="400" y="278" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="#174a70">QUESTION 1 — SINGLE-CALL COPILOT</text><rect x="95" y="350" width="270" height="125" rx="12" fill="#fff" stroke="#4a90c8" stroke-width="2"/><text x="230" y="382" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#17365d">COMPACT PROMPT</text><text x="230" y="412" text-anchor="middle" font-family="Arial" font-size="15" fill="#17365d">Ticket + order snapshot</text><text x="230" y="438" text-anchor="middle" font-family="Arial" font-size="15" fill="#17365d">No help-center dump</text><text x="230" y="460" text-anchor="middle" font-family="Arial" font-size="15" fill="#17365d">No verbose examples / run IDs</text><path d="M365 412 H420" stroke="#4a90c8" stroke-width="3" marker-end="url(#arrow)"/><rect x="430" y="365" width="265" height="95" rx="12" fill="#d6e9ff" stroke="#4a90c8" stroke-width="2"/><text x="562" y="400" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#17365d">ONE LLM CALL</text><text x="562" y="430" text-anchor="middle" font-family="Arial" font-size="15" fill="#17365d">Required fields + short reply</text><path d="M562 460 V510" stroke="#4a90c8" stroke-width="3" marker-end="url(#arrow)"/><rect x="260" y="520" width="300" height="75" rx="12" fill="#fff" stroke="#4a90c8" stroke-width="2"/><text x="410" y="550" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#17365d">Q1 OUTPUT</text><text x="410" y="575" text-anchor="middle" font-family="Arial" font-size="15" fill="#17365d">Graded fields + concise reply</text><rect x="855" y="245" width="690" height="410" rx="18" fill="#f8fcf9" stroke="#4d9b70" stroke-width="3"/><path d="M873 245 H1527 Q1545 245 1545 263 V295 H855 V263 Q855 245 873 245" fill="#eaf7ef"/><text x="1200" y="278" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="#205c3a">QUESTION 2 — FOUR-STAGE PIPELINE</text><rect x="895" y="335" width="270" height="90" rx="12" fill="#fff" stroke="#4d9b70" stroke-width="2"/><text x="1030" y="370" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#205c3a">1. TRIAGE</text><text x="1030" y="398" text-anchor="middle" font-family="Arial" font-size="15" fill="#205c3a">Extract relevant order facts</text><path d="M1165 380 H1220" stroke="#4d9b70" stroke-width="3" marker-end="url(#arrow)"/><rect x="1230" y="335" width="270" height="90" rx="12" fill="#fff" stroke="#4d9b70" stroke-width="2"/><text x="1365" y="370" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#205c3a">2. RETRIEVAL</text><text x="1365" y="398" text-anchor="middle" font-family="Arial" font-size="15" fill="#205c3a">Select one relevant article</text><path d="M1365 425 V475 H1200" fill="none" stroke="#4d9b70" stroke-width="3" marker-end="url(#arrow)"/><rect x="895" y="465" width="270" height="90" rx="12" fill="#fff" stroke="#4d9b70" stroke-width="2"/><text x="1030" y="500" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#205c3a">3. COMPOSITION</text><text x="1030" y="528" text-anchor="middle" font-family="Arial" font-size="15" fill="#205c3a">Combine compact context + facts</text><path d="M1165 510 H1220" stroke="#4d9b70" stroke-width="3" marker-end="url(#arrow)"/><rect x="1230" y="465" width="270" height="90" rx="12" fill="#d9f0e1" stroke="#4d9b70" stroke-width="2"/><text x="1365" y="500" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#205c3a">ONE LLM CALL</text><text x="1365" y="528" text-anchor="middle" font-family="Arial" font-size="15" fill="#205c3a">Compose structured answer</text><path d="M1365 555 V575 H1200" fill="none" stroke="#4d9b70" stroke-width="3" marker-end="url(#arrow)"/><rect x="1050" y="570" width="300" height="65" rx="12" fill="#fff" stroke="#4d9b70" stroke-width="2"/><text x="1200" y="596" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#205c3a">4. AUDIT — LOCAL</text><text x="1200" y="618" text-anchor="middle" font-family="Arial" font-size="14" fill="#205c3a">Validate without another model call</text><rect x="210" y="710" width="1180" height="100" rx="15" fill="#fff4d6" stroke="#d6a23a" stroke-width="2"/><text x="800" y="748" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#6b4e0b">COST-SAVING PRINCIPLES</text><text x="800" y="782" text-anchor="middle" font-family="Arial" font-size="17" fill="#6b4e0b">Reduce prompt tokens  •  Avoid repeated context  •  One model call per track  •  Validate deterministic steps locally</text></svg>