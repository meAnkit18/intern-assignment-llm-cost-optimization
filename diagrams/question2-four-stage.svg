<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#64748b"/></marker></defs><rect width="1200" height="1200" fill="white"/><text x="600" y="55" text-anchor="middle" font-family="Arial" font-size="26" font-weight="bold" fill="#205c3a">QUESTION 2 — FOUR-STAGE PIPELINE</text><rect x="250" y="95" width="700" height="80" rx="15" fill="#eaf2ff" stroke="#4a78c2" stroke-width="3"/><text x="600" y="128" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#17365d">INPUT</text><text x="600" y="155" text-anchor="middle" font-family="Arial" font-size="17" fill="#17365d">Ticket + order record + help-center knowledge base</text><path d="M600 175 V225" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/><rect x="250" y="240" width="700" height="135" rx="15" fill="#f5fbf7" stroke="#4d9b70" stroke-width="3"/><text x="600" y="278" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold" fill="#205c3a">1. TRIAGE — LOCAL</text><text x="600" y="315" text-anchor="middle" font-family="Arial" font-size="17" fill="#205c3a">Read ticket + order; extract only policy-relevant facts</text><text x="600" y="345" text-anchor="middle" font-family="Arial" font-size="16" fill="#205c3a">Product type • delivery age • opened • damage • license status</text><path d="M600 375 V425" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/><rect x="250" y="440" width="700" height="135" rx="15" fill="#f5fbf7" stroke="#4d9b70" stroke-width="3"/><text x="600" y="478" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold" fill="#205c3a">2. RETRIEVAL — LOCAL</text><text x="600" y="515" text-anchor="middle" font-family="Arial" font-size="17" fill="#205c3a">Apply policy rules to choose one candidate article ID</text><text x="600" y="545" text-anchor="middle" font-family="Arial" font-size="16" fill="#205c3a">Avoid loading/sending the 200k+ token help-center corpus</text><path d="M600 575 V625" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/><rect x="190" y="640" width="820" height="145" rx="15" fill="#d9f0e1" stroke="#4d9b70" stroke-width="3"/><text x="600" y="680" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold" fill="#205c3a">3. COMPOSITION — ONLY LLM CALL</text><text x="600" y="720" text-anchor="middle" font-family="Arial" font-size="17" fill="#205c3a">Send thread + order + triage facts + selected article ID</text><text x="600" y="750" text-anchor="middle" font-family="Arial" font-size="16" fill="#205c3a">Generate compact JSON resolution</text><path d="M600 785 V835" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/><rect x="250" y="850" width="700" height="125" rx="15" fill="#f5fbf7" stroke="#4d9b70" stroke-width="3"/><text x="600" y="888" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold" fill="#205c3a">4. AUDIT — LOCAL</text><text x="600" y="925" text-anchor="middle" font-family="Arial" font-size="17" fill="#205c3a">Parse JSON; validate allowed action + article ID</text><text x="600" y="953" text-anchor="middle" font-family="Arial" font-size="16" fill="#205c3a">No second model call</text><path d="M600 975 V1020" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/><rect x="350" y="1035" width="500" height="75" rx="15" fill="#e2f0d9" stroke="#70ad47" stroke-width="3"/><text x="600" y="1080" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#375623">FINAL STRUCTURED RESOLUTION</text></svg>