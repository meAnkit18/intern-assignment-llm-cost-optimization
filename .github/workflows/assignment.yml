name: Assignment tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run assignment tests
        run: pytest -q
      - name: Generate token and points breakdown
        run: python scripts/cost_report.py
      - name: Upload cost report
        uses: actions/upload-artifact@v4
        with:
          name: llm-cost-report
          path: COST_REPORT.md
